.screen:is([data-variant=A],[data-variant=B]) .content{grid-template-columns:1fr 1.9fr;grid-template-rows:24cqw 11.8cqw 6.9cqw;gap:0 2.6cqw}

.screen:is([data-variant=A],[data-variant=B]) .hero-times{gap:2cqw}
.screen:is([data-variant=A],[data-variant=B]) .hero-times strong{font-size:2.9cqw}
.screen:is([data-variant=A],[data-variant=B]) .solar{grid-column:2;grid-row:1;padding-top:.3cqw}
.screen:is([data-variant=A],[data-variant=B]) .solar svg{height:22cqw}
.screen:is([data-variant=A],[data-variant=B]) .schedule{grid-column:1 / -1;grid-row:2;border-left:0;border-top:1px solid var(--line);padding:1cqw 0 0}
.screen:is([data-variant=A],[data-variant=B]) .schedule h3{font-size:.85cqw;margin:0 0 .65cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.screen:is([data-variant=A],[data-variant=B]) .table-head{display:none}

.screen:is([data-variant=A],[data-variant=B]) .prayer-name{width:100%;font-size:1.3cqw;margin-bottom:.15cqw}

.screen:is([data-variant=A],[data-variant=B]) .time::before{content:attr(data-label);display:block;font-size:.75cqw;color:var(--muted);letter-spacing:0;margin-bottom:.3cqw;text-align:left}

</style></head><body>
<header class="studio"><div><h1>Open Masjid Display <span style="color:#edcc89">/</span> Design study</h1><p>Solar-led layouts · illustrative data · no live prayer or weather calculations</p></div><div class="tools">
<label>Scene <select id="scene"><option value="day">Afternoon</option><option value="dawn">Dawn</option><option value="night">Night</option></select></label>
<label>Weather <select id="weather"><option value="rain">Rain ahead</option><option value="sun">Clear</option><option value="snow">Snow ahead</option><option value="missing">Unavailable</option></select></label>
<label><input id="motion" type="checkbox"> Motion</label><label><input id="long" type="checkbox"> Long notice</label><label><input id="iqamah" type="checkbox" checked> Iqamah</label><button id="view">TV view</button></div></header>
<div class="preview"><main id="screen" class="screen" aria-label="Illustrative prayer display"></main></div>
<p class="study-caption" id="caption"></p>
<nav class="switcher" aria-label="Prototype variations"><button id="prev" aria-label="Previous design">←</button><div class="selection" aria-live="polite"><b id="variant-name"></b><small id="state"></small></div><button id="next" aria-label="Next design">→</button><button id="exit" aria-label="Toggle TV view">⛶</button></nav>
<script>
const variants=['A','B'];
const names={A:'Horizon · dark',B:'Daylight · light'};
const descriptions={A:'B’s solar-led composition in A’s dark palette. The clock wedge shows the remaining interval.',B:'The preferred solar-led composition in a light palette. The clock wedge shows the remaining interval.'};
const fixtures={day:{name:'Asr',start:'4:42',iqamah:'5:00',period:'PM',clock:'4:18 PM',label:'Next prayer',count:'Begins in 24 min',sun:'Afternoon light',sunX:548,sunY:102},dawn:{name:'Fajr',start:'5:32',iqamah:'5:55',period:'AM',clock:'5:42 AM',label:'Coming up',count:'Iqamah in 13 min',sun:'Before sunrise',sunX:76,sunY:279},night:{name:'Fajr',start:'5:33',iqamah:'5:55',period:'AM',clock:'9:15 PM',label:'Tomorrow’s prayer',count:'Begins in 8 h 18 min',sun:'Sun below the horizon',sunX:null,sunY:null}};
const schedule=[['Fajr','5:32','5:55'],['Dhuhr','1:08','1:30'],['Asr','4:42','5:00'],['Maghrib','7:02','7:12'],['Isha','8:21','8:40']];
function readState(search){const p=new URLSearchParams(search);return {variant:variants.includes(p.get('variant'))?p.get('variant'):'A',scene:Object.hasOwn(fixtures,p.get('scene'))?p.get('scene'):'day',weather:['rain','sun','snow','missing'].includes(p.get('weather'))?p.get('weather'):'rain',motion:p.get('motion')==='1',long:p.get('notice')==='long',iqamah:p.get('iqamah')!=='0'};}
let state=readState(location.search);
function previewPrayer(s){if(s.scene==='dawn'&&!s.iqamah)return {...fixtures.day,name:'Dhuhr',start:'1:08',iqamah:'1:30',period:'PM',clock:'5:42 AM',label:'Next prayer',count:'Begins in 7 h 26 min'};return fixtures[s.scene];}

function dialData(s){
  const now={day:16*60+18,dawn:5*60+42,night:21*60+15}[s.scene];
  const target=s.scene==='day'?16*60+42:s.scene==='night'?24*60+5*60+33:s.iqamah?5*60+55:13*60+8;
  return {now,target,remaining:target-now,start:(now%720)/2,sweep:(target-now)/2};
}
function clockPoint(degrees,radius){const rad=(degrees-90)*Math.PI/180;return [90+Math.cos(rad)*radius,90+Math.sin(rad)*radius];}
function analogTimer(){
  const d=dialData(state),start=clockPoint(d.start,72),end=clockPoint(d.start+d.sweep,72);
  const arc=`M ${start.join(' ')} A 72 72 0 ${d.sweep>180?1:0} 1 ${end.join(' ')}`;
  const hour=clockPoint(d.start,41),minute=clockPoint((d.now%60)*6,59);
  const ticks=Array.from({length:12},(_,i)=>{const a=clockPoint(i*30,73),b=clockPoint(i*30,78);return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--muted)" opacity=".7"/>`;}).join('');
  const duration=d.remaining<60?`${d.remaining} min`:`${Math.floor(d.remaining/60)} h ${d.remaining%60} min`;
  const event=state.scene==='dawn'&&state.iqamah?'until iqamah':'until prayer begins';
  return `<div class="analog"><svg viewBox="0 0 180 180" role="img" aria-label="Analog countdown: ${duration} ${event}. Shaded clockwise interval from now to the gold target dot on a 12-hour clock."><circle cx="90" cy="90" r="78" fill="var(--soft)" stroke="var(--line)"/><path class="dial-sector" d="M90 90 L${start.join(' ')} A72 72 0 ${d.sweep>180?1:0} 1 ${end.join(' ')} Z"/><path class="dial-track" d="${arc}"/>${ticks}<text x="90" y="34" text-anchor="middle">12</text><text x="150" y="95" text-anchor="middle">3</text><text x="90" y="157" text-anchor="middle">6</text><text x="30" y="95" text-anchor="middle">9</text><line class="dial-hand" x1="90" y1="90" x2="${hour[0]}" y2="${hour[1]}" style="stroke-width:4"/><line class="dial-hand" x1="90" y1="90" x2="${minute[0]}" y2="${minute[1]}" opacity=".75"/><circle cx="90" cy="90" r="4" fill="var(--ink)"/><circle cx="${end[0]}" cy="${end[1]}" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/></svg><div class="analog-copy"><strong>${duration}</strong>${event}<small>Shaded arc: time remaining<br>Gold dot: next event</small></div></div>`;
}

function hero(){const d=previewPrayer(state);return `<section class="hero"><p class="eyebrow">${d.label}</p><h2>${d.name}</h2><div class="hero-times"><div><span>Prayer begins</span><strong>${d.start}<small>${d.period}</small></strong></div>${state.iqamah?`<div><span>Iqamah</span><strong>${d.iqamah}<small>${d.period}</small></strong></div>`:''}</div>${analogTimer()}</section>`;}
function solar(){const d=fixtures[state.scene];return `<section class="solar" aria-label="Illustrative solar arc: ${d.sun}"><svg viewBox="0 0 800 340" role="img" aria-label="Schematic day arc, sunrise at 6:41 AM, sunset at 7:02 PM"><defs><radialGradient id="glow"><stop stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient></defs><path d="M65 292 Q400 -180 735 292 L735 310 L65 310Z" fill="url(#glow)"/><path class="horizon" d="M20 249H780"/><text x="760" y="237" text-anchor="end" style="font-size:14px;letter-spacing:2px">HORIZON</text><path class="arc" d="M65 292 Q400 -180 735 292"/><path class="arc-lit" d="M96 249 Q260 28 400 56" opacity="${state.scene==='night'?'.35':'.85'}"/><circle cx="96" cy="249" r="5" fill="var(--accent)"/><circle cx="704" cy="249" r="5" fill="var(--accent)"/><circle cx="400" cy="56" r="4" fill="var(--muted)"/><text class="event-name" x="165" y="282" text-anchor="middle">Sunrise</text><text x="165" y="305" text-anchor="middle">6:41 AM</text><text class="event-name" x="704" y="282" text-anchor="middle">Sunset</text><text x="704" y="305" text-anchor="middle">7:02 PM</text><text x="400" y="28" text-anchor="middle">Dhuhr · 1:08</text><circle cx="76" cy="277" r="3" fill="var(--muted)"/><text x="48" y="333" text-anchor="middle">Fajr</text><circle cx="724" cy="277" r="3" fill="var(--muted)"/><text x="756" y="333" text-anchor="middle">Isha</text><text x="626" y="131" text-anchor="middle">Asr</text>${d.sunX===null?`<text class="sun-label" x="400" y="196" text-anchor="middle">Night</text><text x="400" y="226" text-anchor="middle">Sun below the horizon</text>`:`<circle cx="${d.sunX}" cy="${d.sunY}" r="46" fill="url(#glow)"/><circle cx="${d.sunX}" cy="${d.sunY}" r="13" fill="var(--accent)"/><circle cx="${d.sunX}" cy="${d.sunY}" r="21" fill="none" stroke="var(--accent)" opacity=".4"/><text class="sun-label" x="${state.scene==='dawn'?265:d.sunX}" y="${state.scene==='dawn'?208:d.sunY-37}" text-anchor="middle">${d.sun}</text>`}</svg><p class="legend">A schematic solar arc · positions and times are sample data</p></section>`;}
function timetable(){const next=previewPrayer(state).name;return `<section class="schedule"><h3>Today’s prayer times <small style="font-size:.7cqw;color:var(--muted);font-weight:400">· Fajr AM / others PM</small></h3><div class="table-head"><span>Prayer</span><span>Begins</span>${state.iqamah?'<span>Iqamah</span>':''}</div><div class="rows">${schedule.map(([n,a,b])=>`<div class="prayer-row ${n===next&&state.scene!=='night'?'current':''}"><span class="prayer-name">${n}</span><span class="time" data-label="Begins">${a}</span>${state.iqamah?`<span class="time" data-label="Iqamah">${b}</span>`:''}</div>`).join('')}</div><p class="schedule-note">Fajr AM · all remaining prayers PM<br>Illustrative mosque-approved timetable</p></section>`;}
function context(){const w={rain:['☂','Rain possible','Next 3 hours · 65% chance · 22° → 19°C'],sun:['☀','Clear skies ahead','Next 3 hours · 24° → 21°C'],snow:['❄','Snow possible','Next 3 hours · 60% chance · −1° → −3°C'],missing:['—','Weather unavailable','Prayer times remain visible']}[state.weather];return `<section class="context"><div class="weather"><span class="weather-icon" aria-hidden="true">${w[0]}</span><div><strong>${w[1]}</strong><small>${w[2]}</small></div></div><div class="moon"><svg viewBox="0 0 50 50" role="img" aria-label="Sample waxing moon, 68 percent illuminated"><circle cx="25" cy="25" r="21" fill="var(--line)"/><path d="M25 4 A21 21 0 0 1 25 46 C15 40 15 10 25 4" fill="var(--ink)"/></svg><div><strong>Waxing moon · 68% illuminated</strong><small>Sample reminder · Monday fast tomorrow</small></div></div></section>`;}
function render(){const s=document.querySelector('#screen');s.dataset.variant=state.variant;s.className=`screen ${state.scene==='night'?'night':''} ${state.iqamah?'':'no-iqamah'}`;const effects=['rain','snow'].includes(state.weather)?`<div aria-hidden="true" class="effects ${state.weather} ${state.motion?'':'still'}">${Array.from({length:24},(_,i)=>`<i style="--x:${(i*37)%100}%;--y:${(i*17)%100}%;--delay:-${i*.17}s"></i>`).join('')}</div>`:'';s.innerHTML=`${effects}<div class="identity"><div class="brand"><span class="brandmark" aria-hidden="true"></span>Open Masjid Display<small>Community prayer space · sample location</small></div><div class="datetime"><div class="clock">${fixtures[state.scene].clock}</div><div class="date">Sunday, 20 September · sample day</div></div></div><div class="content">${hero()}${solar()}${timetable()}${context()}</div><footer class="notice"><b>Community notice</b><p>${state.long?'Community dinner this Saturday after Maghrib. Families and neighbours are welcome. Please bring a reusable bottle and register with the front desk by Thursday.':'Community dinner · Saturday after Maghrib · Everyone is welcome.'}</p></footer>`;document.querySelector('#variant-name').textContent=`${state.variant} · ${names[state.variant]}`;document.querySelector('#state').textContent=`${state.scene} · ${state.weather} · ${state.iqamah?'with iqamah':'prayer starts only'}`;document.querySelector('#caption').textContent=`${descriptions[state.variant]} All times, weather and lunar values are illustrative. The moon reminder is a placement example, not a verified Hijri-calendar recommendation. Use ← → to compare; TV view hides the study controls, Esc restores them.`;for(const key of ['scene','weather'])document.querySelector('#'+key).value=state[key];for(const key of ['motion','long','iqamah'])document.querySelector('#'+key).checked=state[key];}
function update(patch){state={...state,...patch};const p=new URLSearchParams({variant:state.variant,scene:state.scene,weather:state.weather,motion:state.motion?'1':'0',notice:state.long?'long':'short',iqamah:state.iqamah?'1':'0'});history.replaceState(null,'','?'+p);render();}
function cycle(step){update({variant:variants[(variants.indexOf(state.variant)+step+variants.length)%variants.length]});}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
for(const key of ['scene','weather'])document.querySelector('#'+key).onchange=e=>update({[key]:e.target.value});
for(const key of ['motion','long','iqamah'])document.querySelector('#'+key).onchange=e=>update({[key]:e.target.checked});
function toggleView(){document.body.classList.toggle('immersive');document.querySelector('#view').textContent=document.body.classList.contains('immersive')?'Exit TV view':'TV view';}
document.querySelector('#view').onclick=toggleView;document.querySelector('#exit').onclick=toggleView;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('immersive');document.querySelector('#view').textContent='TV view';return;}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});
window.addEventListener('popstate',()=>{state=readState(location.search);render();});
function runChecks(){const assert=(v,m)=>{if(!v)throw Error(m);};assert(readState('?variant=<bad>&scene=invalid').variant==='A','Invalid variant fallback');assert(readState('?scene=invalid').scene==='day','Invalid scene fallback');assert(previewPrayer({...state,scene:'dawn',iqamah:false}).name==='Dhuhr','Without iqamah dawn advances to Dhuhr');assert(previewPrayer({...state,scene:'dawn',iqamah:true}).name==='Fajr','With iqamah retain Fajr');assert(fixtures.night.label==='Tomorrow’s prayer','Night labels tomorrow');assert(dialData({scene:'night',iqamah:true}).remaining===498,'Overnight dial duration');assert(dialData({scene:'dawn',iqamah:true}).remaining===13,'Iqamah dial duration');assert(dialData({scene:'dawn',iqamah:false}).remaining===446,'No-iqamah dial advances');assert(dialData({scene:'day',iqamah:true}).remaining===24,'Afternoon dial duration');const saved={...state};for(const variant of variants){for(const scene of Object.keys(fixtures)){state={...saved,variant,scene};render();assert(document.querySelectorAll('.prayer-row').length===5,'Full schedule stays visible');assert(document.querySelectorAll('.hero-times>div').length===(state.iqamah?2:1),'Paired times');}}state=saved;render();console.info('Prototype checks passed');return 'Prototype checks passed';}
render();if(new URLSearchParams(location.search).has('check')){runChecks();document.querySelector('#caption').textContent+=' Prototype checks passed.';}
</script></body></html>
